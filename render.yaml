services:
  - type: web
    name: nhaxuong-backend
    runtime: docker
    dockerfilePath: BE/Dockerfile
    dockerContext: BE
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 8080
      - key: ASPNETCORE_URLS
        value: http://+:8080
    healthCheckPath: /healthz
